name: RepLog CI (build + verify)

on:
  push:
    branches: [ main, rc41-exercise-presentation, merge-rx2-into-fresh, rc19-product-completion, rc* ]
  pull_request: [ rc* ]
  workflow_dispatch:

jobs:
  build-and-unit:
    name: Build (debug+release) + unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      # Phase 0: builds must succeed with no warnings-as-errors surprises.
      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble Release (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      # JVM unit tests (domain/util correctness incl. coaching content contract).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Android Lint (surfaces manifest/resource/lint warnings for Phase 0).
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replog-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**

  instrumented:
    name: Instrumented tests (emulator) - runtime walkthrough + migration
    runs-on: ubuntu-latest
    # Emulator runtime checks: this is the phase that turns "NOT APPLICABLE here"
    # into genuinely executed runtime verification (Phases 1/2/5/6/9 subset).
    strategy:
      matrix:
        api-level: [ 26, 34 ]   # minSdk and targetSdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/**
