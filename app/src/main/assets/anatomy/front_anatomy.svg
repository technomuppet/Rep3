<!--
  Professional Vector Anatomy Asset — Front Body
  RC47: Independently addressable muscle regions for runtime activation rendering.
  Each path uses a unique id mapped to MuscleRegion enum values.
  The anatomy artwork exists as an external asset; the renderer loads,
  maps, and applies activation colours only.
-->
